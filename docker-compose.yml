services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicetutor
      POSTGRES_USER: voicetutor
      POSTGRES_PASSWORD: voicetutor
    ports:
      - "5432:5432"
    volumes:
      - voicetutor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicetutor"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://voicetutor:voicetutor@postgres:5432/voicetutor
      DATABASE_SSL: "false"
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  voicetutor_pg:
